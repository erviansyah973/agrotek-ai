<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Kesalahan Server · AGROTEK AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        .err-page {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(800px 500px at 20% 30%, rgba(239,68,68,.15), transparent 60%),
                radial-gradient(700px 500px at 85% 70%, rgba(245,158,11,.10), transparent 60%),
                linear-gradient(180deg, #1a0505, #0a1628);
            color: #f1f5f9;
            padding: 40px 20px;
            text-align: center;
        }
        .err-inner { max-width: 560px; }
        .err-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.05em;
            background: linear-gradient(135deg, #f87171 0%, #fbbf24 60%, #ef4444 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .err-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: .85;
            animation: shake 2.5s ease-in-out infinite;
        }
        @keyframes shake {
            0%,90%,100% { transform: rotate(0); }
            93% { transform: rotate(-8deg); }
            96% { transform: rotate(8deg); }
        }
        .err-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: -.02em;
        }
        .err-desc {
            font-size: 1rem;
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 32px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        .err-note {
            display: inline-block;
            padding: 10px 18px;
            background: rgba(251,191,36,.10);
            border: 1px solid rgba(251,191,36,.30);
            color: #fbbf24;
            border-radius: 10px;
            font-size: .82rem;
            margin-bottom: 24px;
        }
        .err-actions {
            display: flex; gap: 14px; justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 24px;
            border-radius: 999px;
            font-weight: 600;
            font-size: .95rem;
            transition: all .25s;
            text-decoration: none;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 6px 20px rgba(239,68,68,.30);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(239,68,68,.40);
        }
        .btn-ghost {
            background: rgba(255,255,255,.06);
            color: #f1f5f9;
            border-color: rgba(255,255,255,.18);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,.12);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="err-page">
        <div class="err-inner">
            <div class="err-icon">⚠️</div>
            <div class="err-code">500</div>
            <h1 class="err-title">Kesalahan Server</h1>
            <p class="err-desc">
                Maaf, terjadi kesalahan internal. Tim kami sudah dinotifikasi.
                Silakan coba beberapa saat lagi atau kembali ke beranda.
            </p>
            <div class="err-note">
                💡 Kalau ini terjadi terus, hubungi tim AGROTEK AI
            </div>
            <div class="err-actions">
                <a href="/" class="btn btn-primary">🔄 Coba Lagi</a>
                <a href="/hub" class="btn btn-ghost">Hub Modul</a>
            </div>
        </div>
    </div>
</body>
</html>
