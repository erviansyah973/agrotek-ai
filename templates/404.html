<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Halaman Tidak Ditemukan · AGROTEK AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        .err-page {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(800px 500px at 20% 30%, rgba(16,185,129,.15), transparent 60%),
                radial-gradient(700px 500px at 85% 70%, rgba(14,165,233,.12), transparent 60%),
                linear-gradient(180deg, #071022, #0a1628);
            color: #f1f5f9;
            padding: 40px 20px;
            text-align: center;
        }
        .err-inner { max-width: 560px; }
        .err-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.05em;
            background: linear-gradient(135deg, #6ee7b7 0%, #38bdf8 60%, #34d399 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .err-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: .8;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-10px); }
        }
        .err-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: -.02em;
        }
        .err-desc {
            font-size: 1rem;
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 32px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        .err-actions {
            display: flex; gap: 14px; justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 24px;
            border-radius: 999px;
            font-weight: 600;
            font-size: .95rem;
            transition: all .25s;
            text-decoration: none;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 6px 20px rgba(16,185,129,.30);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(16,185,129,.40);
        }
        .btn-ghost {
            background: rgba(255,255,255,.06);
            color: #f1f5f9;
            border-color: rgba(255,255,255,.18);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,.12);
            border-color: rgba(52,211,153,.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="err-page">
        <div class="err-inner">
            <div class="err-icon">🗺️</div>
            <div class="err-code">404</div>
            <h1 class="err-title">Halaman Tidak Ditemukan</h1>
            <p class="err-desc">
                Halaman yang Anda cari tidak tersedia atau telah dipindahkan.
                Periksa kembali URL, atau kembali ke halaman utama AGROTEK AI.
            </p>
            <div class="err-actions">
                <a href="/" class="btn btn-primary">🏠 Ke Beranda</a>
                <a href="/hub" class="btn btn-ghost">Hub Modul</a>
            </div>
        </div>
    </div>
</body>
</html>
